# lab-builder — HTTP to HTTPS redirect for the automation VM.
#
# Install to:
#   /etc/apache2/vhosts.d/lab-builder-ssl.conf   (SLES/openSUSE)
#   /etc/httpd/conf.d/lab-builder-ssl.conf       (RHEL family)
#
# The HTTPS vhost itself is templates/apache/lab_creation-ssl.conf, which serves the whole document root on port 443.
# This file only redirects plain-HTTP requests for /lab-builder to HTTPS; /lab_creation/ (VM provisioning) stays
# reachable over both HTTP and HTTPS.
#
# Requires mod_rewrite. install_automation_node_scripts.sh installs it unless _webui_tls=0.

<Location /lab-builder>
    RewriteEngine on
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</Location>
