# lab-builder — Apache drop-in for the automation VM.
#
# Install to:
#   /etc/apache2/conf.d/lab-builder.conf   (SLES/openSUSE)
#   /etc/httpd/conf.d/lab-builder.conf     (RHEL family)
#
# These are SERVER-SCOPE directives (deliberately not wrapped in a
# <VirtualHost>), so every vhost inherits them — plain http and TLS alike.
# On SLES, conf.d is included from default-server.conf *before* vhosts.d, so an
# SSL vhost defined there picks these up automatically.
#
# ORDER MATTERS: Apache matches Alias/ScriptAlias in the order they are
# declared, first match wins. The specific /lab-builder/admin and
# /lab-builder/api ScriptAliases must be declared BEFORE the broader
# /lab-builder Alias, otherwise API requests are served as static files and 404.
#
# Requires the CGI module (SLES: add 'cgid' to APACHE_MODULES in
# /etc/sysconfig/apache2; RHEL: mod_cgid is on by default) and, for the login
# endpoint, auth_basic, authn_file and authz_user.
#
# The CGI runs as the Apache user. On /lab-builder/api it reads schemas and
# validates labs. /lab-builder/admin needs a login (users in
# /etc/lab-builder/htpasswd, managed with lab-builder-passwd) and HTTPS; there it
# saves labs under LABBUILDER_OUTPUT_DIR and runs lab-builder-helper through sudo
# for credentials and lab creation.
#
# +FollowSymLinks on both <Directory> blocks below: lab-builder-ssl.conf's
# HTTP->HTTPS redirect uses a <Location>-scoped RewriteRule covering both of
# these paths. mod_rewrite refuses to run per-directory without FollowSymLinks
# or SymLinksIfOwnerMatch (AH00670) and 403s instead — this bites plain-HTTP
# (redirect never fires) and HTTPS (direct access) alike, since both resolve
# to these same filesystem paths.

Define LABBUILDER_ROOT /srv/www/lab-builder

# ── JSON API (declared first: most specific) ──────────────────────────────────
ScriptAlias /lab-builder/admin ${LABBUILDER_ROOT}/cgi-bin/labbuilder.py
ScriptAlias /lab-builder/api ${LABBUILDER_ROOT}/cgi-bin/labbuilder.py

# The login is asked for over HTTPS only, so a password never crosses plain
# HTTP: there lab-builder-ssl.conf redirects to HTTPS first, and without TLS the
# API refuses every login action (no user, no HTTPS).
<Location /lab-builder/admin>
    <If "%{HTTPS} == 'on'">
        AuthType Basic
        AuthName "lab-builder"
        AuthBasicProvider file
        AuthUserFile /etc/lab-builder/htpasswd
        Require valid-user
    </If>
</Location>

<Directory ${LABBUILDER_ROOT}/cgi-bin>
    Require all granted
    Options +ExecCGI +FollowSymLinks
    SetHandler cgi-script

    # --- optional overrides (scripts/libs dirs are auto-detected) ---
    # SetEnv LABBUILDER_SCRIPTS_DIR /usr/local/bin
    # SetEnv LABBUILDER_LIBS_DIR    /usr/local/lib/lab_creation
    SetEnv LABBUILDER_OUTPUT_DIR  /srv/www/lab-builder/labs
</Directory>

# ── Static single-page app ────────────────────────────────────────────────────
Alias /lab-builder ${LABBUILDER_ROOT}/htdocs

<Directory ${LABBUILDER_ROOT}/htdocs>
    Require all granted
    Options -Indexes +FollowSymLinks
    DirectoryIndex index.html
</Directory>
