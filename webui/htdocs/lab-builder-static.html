<!DOCTYPE html>
<html lang="en">
<head>

  <style>

</head>
<body>

ther app ids to install and enable, for example [\"deck\", \"forms\", \"notes\"]"}, {"name": "nextcloud_office", "required": false, "default": "", "type": "string", "description": "{\"provider\": \"onlyoffice\", \"eurooffice\" or \"collabora\"; \"document_server_url\" (onlyoffice and eurooffice); \"wopi_url\" (collabora only); \"jwt_secret\" (onlyoffice and eurooffice; required when the server is not deployed here); \"deploy_server\": \"true\" or \"false\" (default false), which also deploys that provider's Document Server on this host; \"server_image\"; \"server_version\" (default latest); \"server_port\" (default 8443)}. With deploy_server true, the URLs default to http://<hostname>:<port>. The matching app is installed and enabled."}, {"name": "nextcloud_airgap", "required": false, "default": "", "type": "string", "description": "\"true\" or \"false\" (default false). Every app installs from a local archive, and the live App Store is not contacted. config.php gets appstoreenabled=false and updatechecker.enabled=false. Every image must already be reachable without internet access, through a private registry mirror or a pre-pulled image on the host."}, {"name": "nextcloud_apps_archive_dir", "required": false, "default": "", "type": "string", "description": "[REQUIRED when nextcloud_airgap is true and any app is enabled] a local directory on the automation node that holds one <appid>.tar.gz per app. Download each archive from apps.nextcloud.com on a connected machine. The archives are copied to the host with scp and extracted, as Nextcloud's manual offline procedure describes."}, {"name": "nextcloud_rel", "required": false, "default": "", "type": "string", "description": "Helm repo alias (default nextcloud)"}, {"name": "nextcloud_repo_url", "required": false, "default": "", "type": "url", "description": "Helm repo URL (default https://nextcloud.github.io/helm/)"}, {"name": "nextcloud_chart_version", "required": false, "default": "", "type": "version", "description": ersion (empty = latest \u2014 the chart's own docs recommend pinning an explicit version for reproducible deployments; left to the caller's own judgement here, same stance as every other Helm-based addon in this project)"}, {"name": "seafile_namespace", "required": false, "default": "\"seafile\"", "type": "namespace", "description": "Kubernetes namespace"}, {"name": "seafile_extra_values", "required": false, "default": "", "type": "string", "description": "a dict of additional raw `--set key=value` pairs passed straight through to `helm upgrade --install`, for anything this addon doesn't expose its own field for (JWT_PRIVATE_KEY, SEAFILE_MYSQL_DB_PASSWORD, INIT_SEAFILE_ADMIN_PASSWORD and INIT_SEAFILE_MYSQL_ROOT_PASSWORD are real required Kubernetes Secret values per the chart's own docs \u2014 generated here and passed through --set the same as every other value, since this project's other Helm-chart addons don't manage separate Secret objects either)"}], "capabilities": {"targets": ["container", "vm", "baremetal"], "layers": ["kubernetes", "standalone-container"], "requires_kubernetes": ["rke2", "k3s"], "aux_services": []}}, "skynet_simulator": {"schema_version": "1.0", "addon": "skynet_simulator", "section": "skynet_simulator", "description": "configurable keys:", "fields": [{"name": "skynet_simulator_ns", "required": false, "default": "skynet-simulator", "type": "namespace", "description": "namespace"}, {"name": "skynet_simulator_shorthn", "required": false, "default": "skynet-simulator", "type": "string", "description": "hostname prefix for ingress"}], "capabilities": {"targets": ["container"], "layers": ["kubernetes"], "requires_kubernetes": ["rke2", "k3s"], "aux_services": []}}, "smlm": {"schema_version": "1.0", "addon": "smlm", "section": "smlm", "description": "", "fields": [{"name": "smlm_deployment", "required": false, "default": "", "type": "string", "description": "\"kubernetes\" (default) installs the Helm chart on the first server node of a Kubernetes cluster. \"podman\" installs with mgradm and podman directly on a dedicated host or VM, with no Kubernetes. Target nodes list \"smlm\" in addons[]."}, {"name": "smlm_fqdn", "required": false, "default": "", "type": "string", "description": "fully-qualified domain name of the server (e.g. \"smlm.cluster1.mydemo.lab\")"}, {"name": "smlm_scc_user", "required": false, "default": "", "type": "string", "description": "SUSE Customer Center account, used to log in to registry.suse.com for the chart images"}, {"name": "smlm_scc_password", "required": false, "default": "", "type": "password", "description": "SUSE Customer Center account password"}, {"name": "smlm_scc_regcode", "required": false, "default": "", "type": "string", "description": "SUSE Customer Center registration code of the subscription. It registers the base product (SUSEConnect -r) and the SMLM module (SUSEConnect -p <product> -r <code>)."}, {"name": "smlm_coco_replicas", "required": false, "default": "", "type": "integer", "description": "replicas of the confidential-computing attestation container. Unset omits the flag."}, {"name": "smlm_coco_image", "required": false, "default": "", "type": "string", "description": "image of that container (default \"suse/multi-linux-manager/5.2/x86_64/server-attestation\")"}, {"name": "smlm_coco_tag", "required": false, "default": "", "type": "string", "description": "tag override for that image"}, {"name": "smlm_scc_account", "required": false, "default": "", "type": "string", "description": "name of an encrypted credential file (credential_kind \"scc\") under /etc/lab_creation/credentials/ to read smlm_scc_user, smlm_scc_password and smlm_scc_regcode from. If unset and exactly one \"scc\" file exists, it is used. Plaintext fields above remain valid. smlm_scc_user / smlm_scc_password : also used for the podman login to registry.suse.com, and for \"mgr-sync add credentials\". That step is required when smlm_channels or smlm_activation_keys is set, and setup_smlm_podman() fails with a clear message when they are missing. Without channels or keys, the registry login is skipped and SUSEConnect alone covers the pull."}, {"name": "smlm_scc_product", "required": false, "default": "", "type": "string", "description": "SCC identifier of the SMLM module, for \"SUSEConnect -p\". Default \"Multi-Linux-Manager-Server-SLE/5.2/x86_64\". Override it if a GA release renames it."}, {"name": "smlm_db_admin_user", "required": false, "default": "", "type": "string", "description": "mlmadmin smlm_db_admin_pass : mlmadmin123"}, {"name": "smlm_db_user", "required": false, "default": "", "type": "string", "description": "mlmuser smlm_db_pass : mlmuser123"}, {"name": "smlm_reportdb_user", "required": false, "default": "", "type": "string", "description": "reportuser smlm_reportdb_pass : reportuser123"}, {"name": "smlm_admin_user", "required": false, "default": "", "type": "string", "description": "admin smlm_admin_pass : admin123 for \"kubernetes\", Smlm12345 for \"podman\" (the mgradm product default, as in install_uyuni.py)"}, {"name": "smlm_email", "required": false, "default": "", "type": "string", "description": "admin e-mail, passed to \"mgradm install --email\" (default admin@lab.local)"}, {"name": "smlm_org", "required": false, "default": "", "type": "string", "description": "organization created at install (default lab)"}, {"name": "smlm_ssl_password", "required": false, "default": "", "type": "password", "description": "password of the generated self-signed CA (default smlm_admin_pass)"}, {"name": "smlm_ssl_country", "required": false, "default": "", "type": "string", "description": "CA subject country code (2 letters) smlm_ssl_state, smlm_ssl_city, smlm_ssl_org, smlm_ssl_ou, smlm_ssl_email : further CA subject fields. Passed as --ssl-<field> only when set, and only on a fresh install. Ignored when the uyuni-server container already exists."}, {"name": "smlm_byos", "required": false, "default": "", "type": "string", "description": "\"true\" when the node boots SUSE's SMLM server BYOS image (qcow2 for KVM, or a cloud marketplace image). The image is registered with smlm_scc_regcode only. It needs no containers module, no SMLM extension and no tooling install. (default false)"}, {"name": "smlm_preinstalled", "required": false, "default": "", "type": "string", "description": "\"true\" when the image already contains an installed, channel-synced server. When the uyuni-server container exists, SCC registration and the tooling install are skipped, smlm_scc_regcode is not required, and channels already on the server are not re-added. (default false)"}, {"name": "smlm_image_admin_pass", "required": false, "default": "", "type": "password", "description": "admin password the image was built with. When set and smlm_admin_pass does not log in, the admin password is changed to smlm_admin_pass before any other step."}, {"name": "smlm_salt_auto_accept", "required": false, "default": "", "type": "string", "description": "\"true\" to accept every new salt minion key. It writes /etc/salt/master.d/zz-lab-auto-accept.conf in the server container and restarts salt-master. For throw-away labs only. (default false)"}, {"name": "smlm_bootstrap_scripts", "required": false, "default": "", "type": "string", "description": "[{\"name\": \"generic_bootstrap.sh\", \"url\": \"https://...\"}]. The files are downloaded on the server host and published under /pub/bootstrap/<name> (mode 0755). name is a plain file name."}, {"name": "smlm_version", "required": false, "default": "", "type": "version", "description": "chart version (empty = latest, e.g. \"5.2.0\")"}, {"name": "smlm_ns", "required": false, "default": "", "type": "namespace", "description": "namespace (default uyuni-server)"}, {"name": "smlm_rel", "required": false, "default": "", "type": "string", "description": "Helm release name (default smlm-server)"}, {"name": "smlm_registry", "required": false, "default": "", "type": "string", "description": "OCI registry of the chart (default registry.suse.com)"}, {"name": "smlm_chart", "required": false, "default": "", "type": "string", "description": "OCI chart path (default suse/multi-linux-manager/5.2/server-helm)"}, {"name": "smlm_img_repository", "required": false, "default": "", "type": "string", "description": "image repository base (default derived from registry and chart, plus /x86_64)"}, {"name": "smlm_img_tag", "required": false, "default": "the chart default, \"latest\"", "type": "string", "description": "tag of all images"}, {"name": "smlm_shorthn", "required": false, "default": "", "type": "string", "description": "short hostname for the DNS entry (default smlm)"}, {"name": "smlm_ingress_class", "required": false, "default": "", "type": "string", "description": "ingress class (default traefik). The SMLM chart does not support nginx."}, {"name": "smlm_super_privileged", "required": false, "default": "", "type": "boolean", "description": "\"true\" runs in super-privileged mode (default false, which uses AppArmor or SELinux)"}, {"name": "smlm_storage_class", "required": false, "default": "", "type": "string", "description": "StorageClass (empty = cluster default)"}, {"name": "smlm_lh_overprovision", "required": false, "default": "", "type": "string", "description": "Longhorn over-provisioning percentage, when smlm_storage_class is \"longhorn\" (default 500)"}, {"name": "smlm_db_ha", "required": false, "default": "", "type": "string", "description": "\"true\" replaces the single-pod PostgreSQL with a CloudNativePG cluster (default false). The 'db' and 'reportdb' hostnames then point at the operator's primary Service, smlm-db-rw. Host-level HA needs a cluster with at least as many nodes as replicas."}, {"name": "smlm_db_ha_replicas", "required": false, "default": "", "type": "integer", "description": "PostgreSQL instances (default 3)"}, {"name": "smlm_db_ha_sync", "required": false, "default": "", "type": "string", "description": "\"true\" (default) for synchronous replication. A primary failure loses no committed transaction, but writes stall while no standby is available. \"false\" is asynchronous."}, {"name": "smlm_db_ha_size", "required": false, "default": "", "type": "string", "description": "data volume per instance (default 50Gi)"}, {"name": "smlm_db_ha_pg_image", "required": false, "default": "", "type": "string", "description": "PostgreSQL image (default ghcr.io/cloudnative-pg/postgresql:18, which must match SMLM 5.2's major version)"}, {"name": "smlm_db_ha_cnpg_version", "required": false, "default": "", "type": "version", "description": "CloudNativePG operator chart version (default latest) Failover test, after deployment: install_smlm.py <lab.json> --test-failover It writes a canary row, deletes the primary pod, measures promotion and write recovery, and checks that no committed row was lost and the web UI stayed up. For a harder test, power off the primary's node VM."}, {"name": "smlm_activation_key", "required": false, "default": "", "type": "string", "description": "key name"}, {"name": "smlm_activation_key_desc", "required": false, "default": "the key name", "type": "string", "description": "description"}, {"name": "smlm_activation_key_base_channel", "required": false, "default": "", "type": "string", "description": "base channel label. Required when smlm_activation_key is set."}, {"name": "smlm_activation_key_child_channels", "required": false, "default": "", "type": "string", "description": "space-separated child channel labels"}, {"name": "smlm_activation_key_universal_default", "required": false, "default": "", "type": "string", "description": "\"true\" marks it as the organization's universal default (default false)"}, {"name": "smlm_activation_key_entitlements", "required": false, "default": "", "type": "string", "description": "comma-separated, e.g. \"enterprise_entitled,virtualization_host\""}, {"name": "smlm_activation_key_contact_method", "required": false, "default": "", "type": "string", "description": "contact method"}, {"name": "smlm_activation_key_config_channels", "required": false, "default": "", "type": "string", "description": "space-separated config channel labels"}, {"name": "smlm_activation_key_enable_config_deployment", "required": false, "default": "", "type": "string", "description": "\"true\" enables config-file deployment on the key (default false)"}, {"name": "smlm_activation_key_groups", "required": false, "default": "", "type": "string", "description": "space-separated system group names"}, {"name": "smlm_activation_key_appstreams", "required": false, "default": "", "type": "string", "description": "space-separated \"module:stream\" pairs, e.g. \"nodejs:20 postgresql:16\". Applied on every run. An already-enabled module is detected from the server's error and skipped."}, {"name": "smlm_activation_key_packages", "required": false, "default": "", "type": "string", "description": "space-separated package names, added on every run. Names only."}, {"name": "smlm_channels", "required": false, "default": "", "type": "string", "description": "software channel labels (list or space-separated string), added with \"mgr-sync add channels\", together with every activation key's child channels. Needs smlm_scc_user and smlm_scc_password."}, {"name": "smlm_sync_channels", "required": false, "default": "", "type": "string", "description": "channels to ensure are synced (via \"mgr-sync add channel <label>\" when not already present) before the activation key is created."}, {"name": "smlm_beta_channels", "required": false, "default": "", "type": "string", "description": "BETA-flagged channel labels. They are merged into smlm_channels and treated identically. Listing them here makes the opt-in explicit, e.g. [\"sle-product-sles-16.1-x86_64\"]."}, {"name": "smlm_config_channels", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"name\", \"description\", \"type\": \"normal\" (default) | \"state\", \"init_sls\" (state channels only), \"files\": [{\"path\", \"content\", \"owner\", \"group\", \"mode\", \"binary\"}]}] Idempotent per channel and per file. A file whose sha256 already matches is skipped. This does not attach a channel to a registered system. Use smlm_activation_key_config_channels for newly registered clients."}, {"name": "smlm_virtual_host_managers", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"type\": \"aws\" (default), \"region\", \"zone\", \"access_key_id\", \"secret_access_key\"}, {\"label\", \"type\": \"libvirt\", \"uri\", \"sasl_username\", \"sasl_password\"}] The \"aws\" credentials are usually left out of the entry and resolved from a long-lived IAM key, see smlm_vhm_aws_account below. A key on the entry overrides the resolved one for that manager only. The gatherer polls for ever, so it needs a key that does not expire, not an SSO or STS session. For \"libvirt\", sasl fields are optional and can be omitted for SSH-key auth, e.g. \"qemu+ssh://root@nuc6.mydemo.lab/system\"."}, {"name": "smlm_vhm_aws_account", "required": false, "default": "", "type": "string", "description": "name of a 'vhm_aws' credential file under /etc/lab_creation/credentials/ with vhm_aws_access_key_id and vhm_aws_secret_access_key. Auto-discovered when it is the only such file and this is unset."}, {"name": "smlm_virtual_guests", "required": false, "default": "", "type": "string", "description": "[{\"host\": \"nuc6.mydemo.lab\" (an already registered client), \"name\", \"kickstart_profile\" (name of a smlm_kickstart_profiles entry), \"memory_mb\" (2048), \"vcpus\" (2), \"disk_gb\" (20)}]"}, {"name": "smlm_orgs", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"admin_user\", \"admin_pass\", \"admin_email\", \"admin_first_name\", \"admin_last_name\", \"prefix\", \"pam\" (false), \"trust_with\": [\"other-org\", ...], \"share_channels\": [\"channel-label\", ...], \"share_channels_access\": \"protected\" | \"public\" | \"private\", the organization's own smlm_activation_key*, smlm_config_channels and smlm_access_groups, with the same field names}] admin_user, admin_pass and admin_email are required to create the organization. trust_with establishes channel-sharing trust. share_channels marks channels this organization owns as shared, through channel.access.setOrgSharing, so a trusted organization's activation keys can use them."}, {"name": "smlm_users", "required": false, "default": "", "type": "string", "description": "[{\"username\", \"password\", \"first_name\", \"last_name\", \"email\", \"pam\" (false), \"roles\": [...]}] The first four are required for creation, as for an org's admin account. \"roles\" are applied on every run with user_addrole. Use only the fixed labels from 'spacecmd user_listavailableroles': activation_key_admin, channel_admin, config_admin, image_admin, org_admin, regular_user, satellite_admin, system_group_admin. A custom access group label does not belong here. Put the user in that group's \"users\" list instead (see smlm_access_groups)."}, {"name": "smlm_snippets", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"content\"}]. A snippet is used in kickstart and AutoYaST profiles through the $SNIPPET('spacewalk/<org>/<name>') macro. It is idempotent, and new content overwrites it."}, {"name": "smlm_distributions", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"path\", \"base_channel\", \"install_type\"}] path must already exist on the server, with an extracted installer tree under it. Mount the ISO out of band, for example with \"mount -o loop\", and copy the contents there. distribution_create fails with \"initrd could not be found\" otherwise. install_type is one of the labels \"distribution_create --help\" lists on that server, such as sles15generic, sles16generic, rhel_9 or generic_rpm."}, {"name": "smlm_kickstart_profiles", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"distribution\" (name of an smlm_distributions entry), \"root_password\", \"virt_type\": \"none\" (default) | \"para_host\" | \"qemu\" | \"xenfv\" | \"xenpv\", \"variables\": {\"key\": \"value\"}, \"activation_keys\": [...], \"child_channels\": [...]}] root_password is used only at creation, because the server stores only a hash. To change it, delete and recreate the profile. variables, activation_keys and child_channels are applied on every run, diffed against the server's current lists."}, {"name": "smlm_monitoring_enabled", "required": false, "default": "", "type": "boolean", "description": "\"true\" enables the bundled exporters for node, tomcat, postgres, taskomatic and self_monitoring (default unset, which does nothing). This is a switch for exporters the image already includes. It does not point at an external Prometheus. Uyuni is pull-based: an external Prometheus (the \"prometheus\" addon) scrapes this server. Restarts Tomcat and Taskomatic only on the change from disabled to enabled. Ports to open for a remote Prometheus: 9100 (node), 9187 (postgres), 5556 (tomcat JMX), 5557 (taskomatic JMX), 9800 (taskomatic direct), and the web port 80 or 443 for the message-queue metrics path /rhn/metrics."}, {"name": "smlm_image_stores", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"uri\": \"registry.suse.com\", \"type\": \"registry\" | \"os_image\", \"username\", \"password\"}]. type must be a label that image.store.listImageStoreTypes returns on the server. username and password are optional. registry.suse.com needs none for SUSE's own public images. Stores are created before profiles."}, {"name": "smlm_image_profiles", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"type\": \"dockerfile\" | \"kiwi\", \"store\" (label of an smlm_image_stores entry), \"path\": \"https://github.com/USER/project.git#branch:folder\", \"activation_key\"}]. activation_key is required. It decides which channels a build or import can use."}, {"name": "smlm_image_imports", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"version\": \"latest\", \"store\", \"build_host_id\" (numeric id of a system that has the \"Container Build Host\" entitlement; find it with 'spacecmd system_list'), \"activation_key\" (optional)}] Run with install_smlm.py <lab.json> --import-images. It never runs automatically, because each call schedules a new import."}, {"name": "smlm_image_build_hosts", "required": false, "default": "", "type": "string", "description": "[{\"system\": \"registered-hostname\"}]. Enables the \"container_build_host\" entitlement and applies highstate. It runs before imports, so a build_host_id can be used. The Containers module must still be in that system's channels."}, {"name": "smlm_mcp_server", "required": false, "default": "", "type": "string", "description": "{\"version\": \"latest\", \"port\": 8090, \"user\", \"password\" (default the smlm admin account), \"write_tools_enabled\": false, \"ssl_verify\": false} Deploys the Uyuni MCP server (github.com/uyuni-project/mcp-server-uyuni) as a standalone podman container next to uyuni-server, so an MCP client can inspect and manage this server. Only with smlm_deployment \"podman\". The port is bound to 127.0.0.1 only. The server runs without authentication and can hold write credentials, so reach it from elsewhere through an SSH tunnel or port forward."}, {"name": "smlm_recurring_actions", "required": false, "default": "", "type": "string", "description": "[{\"name\" (required, unique per entity), \"entity_type\": \"minion\" | \"group\" | \"org\", \"entity\" (system or group name, or a numeric org id), \"cron_expr\" (\"0 2 * * *\"), \"schedule_type\": \"highstate\" (default) | \"custom\", \"states\": [...] (required for custom)}]"}, {"name": "smlm_maintenance_calendars", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"ical\": \"BEGIN:VCALENDAR ... END:VCALENDAR\"} or {\"label\", \"url\"}]. Give exactly one of ical or url. Calendars are synced, so an existing calendar whose ical or url differs is updated, with the reschedule strategy \"Fail\". Scheduled actions are never cancelled. To sync a live server without anything else, run install_smlm.py <lab.json> --sync-maintenance-calendars."}, {"name": "smlm_maintenance_schedules", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"type\": \"single\" | \"multi\", \"calendar\" (name of a calendar, optional), \"systems\": [...] (optional, assigned right after creation)}]"}, {"name": "smlm_action_chains", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"actions\": [{\"system\", \"type\": \"script\", \"script\": \"...\"} or {\"system\", \"type\": \"highstate\"}]}] A chain is created with its actions and is left unscheduled. It never runs."}, {"name": "smlm_custom_channels", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"name\", \"summary\", \"arch_label\" (\"channel-x86_64\" default for RPM channels), \"parent_label\" (an existing base channel makes this a child channel), \"checksum_type\": \"sha256\", \"packages\": [\"/local/path/to.rpm\", ...]}] Packages are local files on the automation node, pushed with rhnpush. The push works only with smlm_deployment \"podman\". The channel is still created in any case."}, {"name": "smlm_patches", "required": false, "default": "", "type": "string", "description": "[{\"advisory_name\" (required, e.g. \"LAB-2026:0001\"), \"channel\" (an smlm_custom_channels label), \"synopsis\", \"topic\", \"description\", \"solution\", \"advisory_release\": 1, \"advisory_type\": \"Bug Fix Advisory\", \"product\": \"lab-in-a-box\", \"severity\": \"Low\", \"packages\": [names already in that channel]}] The server accepts errata only for channels on its allowlist, java.allow_adding_patches_via_api in /etc/rhn/rhn.conf. The channel is added to that list the first time it is used. Tomcat restarts to apply the change, so expect a short API interruption after the first patch of a run."}, {"name": "smlm_image_builds", "required": false, "default": "", "type": "string", "description": "[{\"profile\" (an smlm_image_profiles label), \"build_host\" (a system with the container build host entitlement), \"version\": \"latest\"}]"}, {"name": "smlm_system_profiles", "required": false, "default": "", "type": "string", "description": "[{\"system\", \"label\", \"description\"}]"}, {"name": "smlm_system_custom_values", "required": false, "default": "", "type": "string", "description": "[{\"system\", \"key\", \"value\"}]. The key must already be defined in smlm_custom_info_keys."}, {"name": "smlm_org_system_transfers", "required": false, "default": "", "type": "string", "description": "[{\"org\", \"systems\": [...]}]. The source and destination organizations must already trust each other, which smlm_orgs trust_with sets up. A system already in the destination organization is skipped."}, {"name": "smlm_sso", "required": false, "default": "", "type": "string", "description": "{\"keycloak_host\" (required; a separate host that the browser can reach), \"keycloak_port\": 8080, \"realm\": \"lab-in-a-box\", \"admin_user\": \"admin\", \"admin_password\": \"admin\", \"demo_user\", \"demo_password\", \"demo_email\"} demo_user is one extra Keycloak user. It must be an existing Uyuni account, because SSO maps to an account and never creates one. A Keycloak user is also created for the SMLM admin account and for each smlm_users entry with a password. A \"pam\": true entry is skipped, because it authenticates through the OS. With SSO enabled, the web login goes through Keycloak for everyone. spacecmd, mgr-sync and this project's automation keep password auth. The keycloak_port must be reachable from the browser. On a cloud node, add it to aws_open_ports. Otherwise the browser times out with nothing logged on either side."}, {"name": "smlm_access_groups", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"description\", \"permissions_from\": [role labels], \"permissions\": [{\"namespace\", \"mode\": \"R\" | \"W\"}], \"users\": [usernames]}] Each user must already exist, from smlm_users or an organization's admin account. Access groups are created after users."}, {"name": "smlm_ansible_control_nodes", "required": false, "default": "", "type": "string", "description": "[{\"system\": \"hostname\"}]. Enables the \"Ansible Control Node\" entitlement and applies highstate to install the ansible package. The system must be registered first. Also run with install_smlm.py <lab.json> --enable-ansible-control-nodes."}, {"name": "smlm_ansible_paths", "required": false, "default": "", "type": "string", "description": "[{\"system\" (hostname) or \"control_node_id\" (numeric), \"type\": \"playbook\" | \"inventory\", \"path\"}]. For \"playbook\", path is a directory, such as /srv/ansible/playbooks. For \"inventory\", path is the inventory file or script."}, {"name": "smlm_ansible_playbooks", "required": false, "default": "", "type": "string", "description": "[{\"control_node_id\", \"playbook_path\", \"inventory_path\", \"earliest\" (optional, default now), \"action_chain_label\" (optional), \"test_mode\": false, \"extra_vars\": \"...\", \"flush_cache\": false}] Run with install_smlm.py <lab.json> --run-ansible-playbooks. It never runs automatically."}, {"name": "smlm_content_projects", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"name\", \"description\", \"sources\": [software channel labels], \"filters\": [{\"name\", \"rule\": \"allow\" | \"deny\", \"entity_type\": \"package\" | \"erratum\" | \"module\" | \"ptf\", \"matcher\", \"field\", \"value\"}], \"environments\": [\"dev\", \"test\", \"prod\"] or [{\"label\", \"name\", \"description\"}]}] Only software channels can be sources. Filters have no lookup by name, so the check is made at project level and the new id is read from spacecmd's output."}, {"name": "smlm_content_lifecycle_actions", "required": false, "default": "", "type": "string", "description": "[{\"project\", \"action\": \"build\", \"message\", \"wait\": true, \"wait_env\", \"wait_timeout\"}, {\"project\", \"action\": \"promote\", \"from_env\", \"wait\": true, \"wait_env\"}] For promote, from_env is the stage being promoted from. The server picks the next stage. \"wait\" polls the environment until it is built or failed."}, {"name": "smlm_scap_scans", "required": false, "default": "", "type": "string", "description": "[{\"system\" or \"group\", \"xccdf_path\", \"profile\"}]. Exactly one of system or group. A group expands to its members. Idempotent by system and xccdf_path. The XCCDF path and the scanner must already exist on the target, unless ensure_openscap_prerequisites() installs them. Run with install_smlm.py <lab.json> --run-scap-scans. It never runs automatically."}, {"name": "smlm_scap_policies", "required": false, "default": "", "type": "string", "description": "[{\"policy_name\", \"scap_content_id\" (a content id uploaded through the Web UI), \"xccdf_profile_id\" (read it from the uploaded document), \"description\", \"earliest\" (ISO local date-time), \"tailoring_file\", \"tailoring_profile_id\", \"oval_files\", \"advanced_args\", \"fetch_remote_resources\": false}] Automatic and idempotent by name. It logs in as smlm_admin_user through the Web UI route. That route is internal and may change between releases. SCAP content and tailoring files are not uploaded by this module. Upload them once through the Web UI, then use their ids here."}, {"name": "smlm_activation_keys", "required": false, "default": "", "type": "string", "description": "[{...}], one dict per key, with the same fields as the smlm_activation_key* keys. This lets one organization define several named keys, one per environment."}, {"name": "smlm_system_groups", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"description\", \"systems\": [...]}]"}, {"name": "smlm_custom_info_keys", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"description\"}]. Must be defined before smlm_system_tags or an environment's custom_info_tags can set a value."}, {"name": "smlm_system_tags", "required": false, "default": "", "type": "string", "description": "[{\"system\", \"tags\": {\"key\": \"value\"}}]. Uyuni has no tag object. These are custom-info values."}, {"name": "smlm_environments", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"system_group\" (name of an smlm_system_groups entry), \"activation_key\" (name of a key), \"custom_info_tags\": {...}, \"recurring_schedule\": {\"type\": \"highstate\" (default) | \"custom\", \"cron\", \"states\" (for custom), \"group_id\" (skips the name lookup), \"extra\": {...}}}] system_group and activation_key are references only. recurring_schedule needs the numeric group id, which is looked up from the name unless group_id is given. Run it with install_smlm.py <lab.json> --run-recurring-schedules."}, {"name": "smlm_grafana_formulas", "required": false, "default": "", "type": "string", "description": "[{\"system\", \"admin_user\" (default admin), \"admin_pass\" (default admin), \"prometheus\": [{\"key\", \"url\" (default http://localhost:9090), \"user\", \"password\"}], \"reportdb\": false, \"is_hub\": false, \"dashboards\": {\"uyuni\": true, \"uyuni_clients\": true, \"postgresql\": true, \"apache\": true}}] Applies SMLM's own grafana Salt formula to the target, which installs Grafana there. This is separate from the install_prometheus.py and install_grafana.py addons, which use podman. The target needs a monitoring add-on subscription and Prometheus. Grafana is not available on SMLM Proxy."}], "capabilities": {"targets": ["container", "vm", "baremetal"], "layers": ["kubernetes", "standalone-container"], "requires_kubernetes": ["rke2", "k3s"], "aux_services": []}}, "smlm_proxy": {"schema_version": "1.0", "addo -separated system group names"}, {"name": "uyuni_activation_key_appstreams", "required": false, "default": "", "type": "string", "description": "space-separated \"module:stream\" pairs, e.g. \"nodejs:20 postgresql:16\". Applied on every run. An already-enabled module is detected and skipped."}, {"name": "uyuni_activation_key_packages", "required": false, "default": "", "type": "string", "description": "space-separated package names, added on every run. Names only."}, {"name": "uyuni_sync_channels", "required": false, "default": "", "type": "string", "description": "channels to ensure are synced (with mgr-sync add channel, when not already present) before the key is created. Independent of uyuni_channels."}, {"name": "uyuni_config_channels", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"name\", \"description\", \"type\": \"normal\" (default) | \"state\", \"init_sls\" (state channels only), \"files\": [{\"path\", \"content\", \"owner\", \"group\", \"mode\", \"binary\"}]}] Idempotent per channel and per file. The channel is not attached to a registered system here. Use uyuni_activation_key_config_channels for newly registered clients."}, {"name": "uyuni_orgs", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"admin_user\", \"admin_pass\", \"admin_email\", \"admin_first_name\", \"admin_last_name\", \"prefix\", \"pam\" (false), \"trust_with\": [...], \"share_channels\": [...], \"share_channels_access\": \"protected\" | \"public\" | \"private\", the organization's own uyuni_activation_key*, uyuni_config_channels and uyuni_access_groups, with the same field names}] admin_user, admin_pass and admin_email are required to create the organization. trust_with establishes channel-sharing trust. share_channels marks channels this organization owns as shared, so a trusted organization's activation keys can use them."}, {"name": "uyuni_users", "required": false, "default": "", "type": "string", "description": "[{\"username\", \"password\", \"first_name\", \"last_name\", \"email\", \"pam\" (false), \"roles\": [...]}] The first four are required for creation. \"roles\" are applied on every run with user_addrole, and only with the fixed labels: activation_key_admin, channel_admin, config_admin, image_admin, org_admin, regular_user, satellite_admin, system_group_admin. A custom access group label does not belong here. List the user in that group's \"users\" instead."}, {"name": "uyuni_access_groups", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"description\", \"permissions_from\": [role labels], \"permissions\": [{\"namespace\", \"mode\": \"R\" | \"W\"}], \"users\": [usernames]}] Each user must already exist, from uyuni_users or an organization's admin account."}, {"name": "uyuni_ansible_control_nodes", "required": false, "default": "", "type": "string", "description": "[{\"system\": \"hostname\"}]. Enables the \"Ansible Control Node\" entitlement and applies highstate to install the ansible package. The system must be registered first."}, {"name": "uyuni_ansible_paths", "required": false, "default": "", "type": "string", "description": "[{\"system\" (hostname) or \"control_node_id\" (numeric), \"type\": \"playbook\" | \"inventory\", \"path\"}]. A playbook path is a directory. An inventory path is the inventory file or script."}, {"name": "uyuni_ansible_playbooks", "required": false, "default": "", "type": "string", "description": "[{\"control_node_id\", \"playbook_path\", \"inventory_path\", \"earliest\" (optional, default now), \"action_chain_label\" (optional), \"test_mode\": false, \"extra_vars\": \"...\", \"flush_cache\": false}] Run with install_uyuni.py <lab.json> --run-ansible-playbooks. It never runs automatically."}, {"name": "uyuni_content_projects", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"name\", \"description\", \"sources\": [software channel labels], \"filters\": [{\"name\", \"rule\": \"allow\" | \"deny\", \"entity_type\": \"package\" | \"erratum\" | \"module\" | \"ptf\", \"matcher\", \"field\", \"value\"}], \"environments\": [\"dev\", \"test\", \"prod\"] or [{\"label\", \"name\", \"description\"}]}] Only software channels can be sources. Filters have no lookup by name, so the check is made at project level."}, {"name": "uyuni_content_lifecycle_actions", "required": false, "default": "", "type": "string", "description": "[{\"project\", \"action\": \"build\", \"message\", \"wait\": true, \"wait_env\", \"wait_timeout\"}, {\"project\", \"action\": \"promote\", \"from_env\", \"wait\": true, \"wait_env\"}] For promote, from_env is the stage being promoted from. The server picks the next stage. \"wait\" polls the environment until it is built or failed. Run with install_uyuni.py <lab.json> --run-clm-actions."}, {"name": "uyuni_scap_scans", "required": false, "default": "", "type": "string", "description": "[{\"system\", \"xccdf_path\", \"profile\"}]. The XCCDF path and the scanner must already exist on the target. Idempotent by system and xccdf_path. Run with install_uyuni.py <lab.json> --run-scap-scans."}, {"name": "uyuni_scap_policies", "required": false, "default": "", "type": "string", "description": "[{\"policy_name\", \"scap_content_id\" (a content id uploaded through the Web UI), \"xccdf_profile_id\" (read it from the uploaded document), \"description\", \"earliest\" (ISO local date-time), \"tailoring_file\", \"tailoring_profile_id\", \"oval_files\", \"advanced_args\", \"fetch_remote_resources\": false}] Automatic and idempotent by name. It logs in as uyuni_admin through the Web UI route. That route is internal and may change between releases. SCAP content and tailoring files are not uploaded by this script. Upload them through the Web UI, then use their ids here."}, {"name": "uyuni_activation_keys", "required": false, "default": "", "type": "string", "description": "[{...}], one dict per key, with the same fields as uyuni_activation_key*. One organization can define several named keys this way."}, {"name": "uyuni_system_groups", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"description\", \"systems\": [...]}]"}, {"name": "uyuni_custom_info_keys", "required": false, "default": "", "type": "string", "description": "[{\"name\", \"description\"}]. Must be defined before uyuni_system_tags or an environment's custom_info_tags can set a value for that key."}, {"name": "uyuni_system_tags", "required": false, "default": "", "type": "string", "description": "[{\"system\", \"tags\": {\"key\": \"value\"}}]. Uyuni has no tag object. These are custom-info values."}, {"name": "uyuni_environments", "required": false, "default": "", "type": "string", "description": "[{\"label\", \"system_group\" (name of a uyuni_system_groups entry), \"activation_key\" (name of a key), \"custom_info_tags\": {...}, \"recurring_schedule\": {\"type\": \"highstate\" (default) | \"custom\", \"cron\", \"states\" (for custom), \"group_id\" (skips the name lookup), \"extra\": {...}}}] system_group and activation_key are references only. Run the schedules with install_uyuni.py <lab.json> --run-recurring-schedules."}], "capabilities": {"targets": ["vm", "baremetal"], "layers": ["standalone-container"], "requires_kubernetes": null, "aux_services": []}}, "weaviate": {"schema_version": "1.0", "addon": "weaviate", "section": "weaviate", "description": "configurable keys:", "fields": [{"name": "weaviate_version", "required": false, "default": "", "type": "version", "description": "Helm chart version (empty = latest)"}, {"name": "weaviate_ns", "required": false, "default": "weaviate", "type": "namespace", "description": "namespace"}, {"name": "weaviate_rel", "required": false, "default": "weaviate", "type": "string", "description": "Helm repo alias"}, {"name": "weaviate_repo_url", "required": false, "default": "https://weaviate.github.io/weaviate-helm", "type": "url", "description": "Helm repo URL"}, {"name": "weaviate_replicas", "required": false, "default": "1 \u2014 chart default", "type": "integer", "description": "StatefulSet replica count"}], "capabilities": {"targets": ["container"], "layers": ["kubernetes"], "requires_kubernetes": ["rke2", "k3s"], "aux_services": []}}, "wikimusic": {"schema_version": "1.0", "addon": "wikimusic", "section": "wikimusic", "description": "configurable keys:", "fields": [{"name": "wikimusic_image", "required": true, "default": "", "type": "string", "description": "a pre-built image reference for WikiMusic. Unlike Colt, WikiMusic's own repo has NO Dockerfile at all \u2014 it's built via GNU Guix (channels.scm/manifest.scm) for reproducible builds. Build one yourself first, e.g. via Guix's own Docker-image export: git clone https://codeberg.org/jjba23/wikimusic.git && cd wikimusic guix pack -f docker -m manifest.scm # produces a loadable tarball then load/push it to a registry this cluster can pull from (this project's own \"harbor\" addon is one option)."}, {"name": "wikimusic_ns", "required": false, "default": "wikimusic", "type": "namespace", "description": "namespace"}, {"name": "wikimusic_shorthn", "required": false, "default": "wikimusic", "type": "string", "description": "hostname prefix for ingress"}, {"name": "wikimusic_port", "required": false, "default": "3000, Artanis' own default", "type": "port", "description": "container port WikiMusic listens on"}], "capabilities": {"targets": ["container"], "layers": ["kubernetes"], "requires_kubernetes": ["rke2", "k3s"], "aux_services": []}}, "wordpress": {"schema_version": "1.0", "addon": "wordpress", "section": "wordpress", "description": "WordPress + MySQL on Kubernetes", "fields": [{"name": "wordpress_ns", "required": false, "default": "wordpress", "type": "namespace", "description": "Kubernetes namespace"}, {"name": "wordpress_name", "required": false, "default": "wordpress", "type": "string", "description": "Deployment and service name"}, {"name": "wordpress_shorthn", "required": false, "default": "wordpress", "type": "string", "description": "Short hostname for ingress"}, {"name": "wordpress_version", "required": false, "default": "", "type": "version", "description": "Helm chart version (empty = latest)"}], "capabilities": {"targets": ["container"], "layers": ["kubernetes"], "requires_kubernetes": ["rke2", "k3s"], "aux_services": []}}}}

  {"schema_version": "1.0", "component": "lab-definition", "description": "lab-in-a-box lab definition file \u2014 passed as the first argument to setup_lab.py and setup_vm.py", "sections": {"common": {"description": "Shared settings applied to every VM in the lab", "fields": [{"name": "ISO_IMAGE", "required": true, "type": "string", "description": "Source QCOW2 image filename (must exist in ISO_LOC on the hypervisor)"}, {"name": "VM_MEM", "required": true, "type": "integer", "min": 256, "description": "RAM in MiB (e.g. 8192)"}, {"name": "VM_DSK", "required": true, "type": "integer", "min": 1, "description": "Disk size in GiB (e.g. 80)"}, {"name": "VM_CPU", "required": true, "type": "integer", "min": 1, "description": "vCPU count"}, {"name": "mymask", "required": false, "type": "integer", "description": "Network prefix length (default: auto-detected from host)"}, {"name": "mygw", "required": false, "type": "string", "pattern": "^(\\d{1,3}\\.){3}\\d{1,3}$", "description": "Default gateway IP (default: auto-detected)"}, {"name": "mydns", "required": false, "type": "string", "pattern": "^(\\d{1,3}\\.){3}\\d{1,3}$", "description": "DNS server IP (default: auto-detected)"}, {"name": "mynet_reverse", "required": false, "type": "string", "description": "Reverse DNS zone prefix e.g. 88.168.192 (default: derived from first node IP)"}, {"name": "mydomain", "required": false, "type": "string", "description": "Lab DNS domain (default: derived from automation VM hostname)"}, {"name": "VM_BOOT", "required": false, "type": "string", "default": "uefi", "enum": ["uefi", "firmware=bios", "bios", "uefi=off", "hd"], "description": "virt-install boot mode"}, {"name": "VM_DSK_BUS", "required": false, "type": "string", "default": "virtio", "enum": ["virtio", "scsi", "sata", "usb", "ide"], "description": "Disk bus type for the primary disk"}, {"name": "VM_NET_MODEL", "required": false, "type": "string", "default": "virtio", "enum": ["virtio", "e1000", "e1000e", "rtl8139", "vmxnet3", "ne2k_pci"], "description": "NIC device model"}, {"name": "VM_OSVARIANT", "required": false, "type": "string", "default": "slem5.4", "description": "OS variant for virt-install (osinfo-query os)"}, {"name": "VM_MACHINE", "required": false, "type": "string", "default": "", "enum": [{"value": "", "label": "(default) virt-install's own choice, currently q35"}, "pc"], "description": "virt-install machine type override \u2014 set to \"pc\" (legacy i440fx) for an old guest whose kernel/GRUB can't find its root disk under q35 (confirmed live for a 2015-era CentOS 7 GenericCloud image); leave unset for every image that already works"}, {"name": "config_method", "required": false, "type": "string", "default": "", "enum": [{"value": "", "label": "(default) Ignition+Combustion"}, "cloud-init", "virt_customize", "install_iso"], "description": "Provisioning method"}, {"name": "network_renderer", "required": false, "type": "string", "default": "NetworkManager", "enum": ["NetworkManager", "networkd", "sysconfig"], "description": "cloud-init network-config's \"renderer\" value (config_method=cloud-init only) \u2014 the default matches SLE Micro/SLES/Leap's own default network stack; set to \"networkd\" for guests whose distro defaults to systemd-networkd instead (e.g. Ubuntu Server, Debian's generic cloud image), or \"sysconfig\" for guests using legacy ifcfg-file networking with NetworkManager not even enabled (e.g. Alibaba Cloud Linux 2's alibase image) \u2014 otherwise their static IP is silently never applied"}, {"name": "install_type", "required": false, "type": "string", "default": "", "enum": [{"value": "", "label": "(default) auto-detect from ISO_IMAGE name"}, "autoyast", "kickstart", "preseed", "autoinstall"], "description": "For install_iso only"}, {"name": "VM_ROOT_PASS", "required": false, "type": "string", "default": "", "description": "Plaintext root password for virt_customize; omit to reuse ROOT_PWD_HASH from lab_creation.cfg (same as cloud-init/Ignition)"}, {"name": "BRIDGE", "required": false, "type": "string", "default": "br0", "description": "Host bridge every VM's NIC attaches to (virt-install --network bridge=<BRIDGE>,mac.address=<mymac>), e.g. virbr0 for libvirt's default NAT network"}, {"name": "ROOT_PWD_HASH", "required": false, "type": "password", "description": "crypt(3) hash of the VMs' root password for cloud-init/Ignition (overrides lab_creation.cfg's own ROOT_PWD_HASH)"}, {"name": "open_ports", "required": false, "type": "string", "description": "Cloud backends: ports reachable from anywhere on each VM (list, e.g. [\"443\", \"69/udp\"]; default protocol tcp) \u2014 aws: security-group rules (needs AWS_SECURITY_GROUP_ID); gcp: a firewall rule + network tag; alibaba: ALIBABA_SECURITY_GROUP_ID rules; exoscale: a per-VM security group; hetzner/scaleway/upcloud/ovhcloud: open by default"}, {"name": "aws_open_ports", "required": false, "type": "string", "description": "backend aws (older form of open_ports): ports opened to 0.0.0.0/0 in the security group (list, e.g. [\"443\", \"69/udp\"]; default protocol tcp) \u2014 needs AWS_SECURITY_GROUP_ID"}, {"name": "ISO_URL", "required": false, "type": "url", "description": "Where to download ISO_IMAGE from (http://, https:// or file://; several space-separated mirrors are tried in order) when it isn't in ISO_LOC yet \u2014 setup_lab.py fetches it onto each KVM host before the preflight. Needs ISO_SHA256 or ISO_SHA256_URL"}, {"name": "ISO_SHA256", "required": false, "type": "string", "description": "sha256 of the ISO_URL download; a mismatching file is moved aside, never booted"}, {"name": "ISO_SHA256_URL", "required": false, "type": "url", "description": "https:// URL of a published checksum file (sha256sum format, e.g. SHA256SUMS) \u2014 for images republished under a fixed name"}, {"name": "ssh_pwauth", "required": false, "type": "string", "default": "false", "enum": ["true", "false"], "description": "config_method=cloud-init only: \"true\" enables SSH password login (cloud-init ssh_pwauth) and root login \u2014 for labs whose exercises log in or bootstrap clients with the root password"}, {"name": "lab_name", "required": false, "type": "string", "description": "Human-readable lab name shown in log output"}, {"name": "backend", "required": false, "type": "string", "default": "libvirt", "enum": ["libvirt", "harvester", "hetzner", "aws", "gcp", "alibaba", "scaleway", "upcloud", "ovhcloud", "exoscale"], "description": "Compute backend for every node in this lab, unless overridden per-node"}, {"name": "cloud_account", "required": false, "type": "string", "description": "Name of a cloud account file under /etc/lab_creation/credentials/<name>.{yaml,json,cfg} (path configurable via lab_creation.cfg's CREDENTIALS_PATH; multiple cloud accounts, the same way KVM_HOSTS gives multiple hypervisors) \u2014 see scripts/setup_credentials.py to create one. Encrypted by default; the file's `cloudtype` becomes the backend (so `backend` is then optional) and its keys (AWS_REGION, etc.) are layered over lab_creation.cfg. Omit for the single default account."}, {"name": "cloud_instance_type", "required": false, "type": "string", "description": "Cloud backends only: an explicit instance type/server type/plan/flavor name, used verbatim instead of auto-picking one from vm_cpu/vm_mem \u2014 see README's Compute backends table for each provider's own official list of valid values"}, {"name": "services", "required": false, "type": "array", "description": "Lab-support services to configure+enable before VMs are created: dns, http (both already running from the automation VM bootstrap; listing them is a no-op today), pxe (see the top-level \"pxe\" section), portforward (DNAT-forwards each node's own \"forwarded_ports\" field from the KVM host's real IP \u2014 see that per-node field). Omit for today's default (nothing extra runs)."}, {"name": "overlay", "required": false, "type": "boolean", "default": false, "description": "Routes this lab's sites (each cloud account, and the home libvirt lab) to each other by their REAL subnets, site-to-site, over a hub-and-spoke WireGuard overlay (libs/overlay.py) \u2014 needed since a cloud node generally cannot route to another cloud account's private network, or to the home lab, any other way. Only each site's own automation VM (or a small dedicated gateway VM, auto-created/reused per non-hub cloud account) ever joins the overlay itself; individual lab nodes just get a local route to other sites' subnets via their own site's gateway \u2014 no per-node WireGuard membership. The hub is the gateway VM for lab_creation.cfg's designated OVERLAY_HUB_ACCOUNT (required). Also configurable via OVERLAY_CIDR (default 10.99.0.0/16, used only for the gateways' own admin addresses) and OVERLAY_WG_PORT (default 51820) in lab_creation.cfg. Known gaps: no DNS changes are made (a node is reachable by its real hostname only once that name already resolves into a now-routed subnet); a site's already-provisioned nodes aren't retroactively re-routed when a new remote site joins later, only at each node's own provisioning time; the AWS-specific source/dest-check disable needed for a cloud site gateway to forward traffic has no equivalent yet for the other 7 cloud backends."}]}, "nodes": {"description": "Map of fully-qualified VM hostname to per-node settings. Keys override common values.", "repeatable": true, "key_label": "hostname (FQDN)", "fields": [{"name": "myip", "required": true, "type": "string", "pattern": "^(\\d{1,3}\\.){3}\\d{1,3}$", "description": "VM IP address \u2014 required for libvirt/harvester; leave empty for a cloud backend (aws/gcp/hetzner/etc.), whose real IP is only known once the provider assigns it at create time"}, {"name": "mymac", "required": false, "type": "string", "pattern": "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$", "description": "VM MAC address (generated and conflict-checked if omitted, libvirt/harvester only \u2014 a cloud backend has no MAC concept and ignores this field entirely)"}, {"name": "kcluster", "required": false, "type": "string", "description": "kcluster name this node belongs to (must exist in kclusters)"}, {"name": "INSTALL_RKE2_TYPE", "required": false, "type": "string", "default": "server", "enum": ["server", "agent"], "description": "Node role"}, {"name": "addons", "required": false, "type": "array", "description": "List of VM-level addon names (install_<addon> scripts). Each entry is either a plain \"<addon>\" string (runs with only that addon's shared top-level config section, same as always), or a single-key {\"<addon>\": {...fields...}} mapping to override that addon's config for this node only \u2014 e.g. a lab registering many different OSes against one shared Uyuni/SMLM server, each node needing its own client_registration_activation_key. See README's addon-config section."}, {"name": "extra_dsk", "required": false, "type": "string", "description": "Additional disk paths or UUID=\u2026 entries (space-separated); per-disk bus: /dev/sdb,bus=scsi"}, {"name": "VM_MEM", "required": false, "type": "integer", "min": 256, "description": "Overrides common.VM_MEM for this node only"}, {"name": "VM_DSK", "required": false, "type": "integer", "min": 1, "description": "Overrides common.VM_DSK for this node only"}, {"name": "VM_CPU", "required": false, "type": "integer", "min": 1, "description": "Overrides common.VM_CPU for this node only"}, {"name": "VM_BOOT", "required": false, "type": "string", "enum": ["uefi", "firmware=bios", "bios", "uefi=off", "hd"], "description": "Overrides common.VM_BOOT for this node only"}, {"name": "VM_DSK_BUS", "required": false, "type": "string", "enum": ["virtio", "scsi", "sata", "usb", "ide"], "description": "Overrides common.VM_DSK_BUS for this node only"}, {"name": "VM_NET_MODEL", "required": false, "type": "string", "enum": ["virtio", "e1000", "e1000e", "rtl8139", "vmxnet3", "ne2k_pci"], "description": "Overrides common.VM_NET_MODEL for this node only"}, {"name": "VM_MACHINE", "required": false, "type": "string", "enum": ["", "pc"], "description": "Overrides common.VM_MACHINE for this node only \u2014 set per-node when only one old guest in an otherwise-modern lab needs the legacy \"pc\" machine type"}, {"name": "VM_OSVARIANT", "required": false, "type": "string", "description": "Overrides common.VM_OSVARIANT for this node only"}, {"name": "VM_ROOT_PASS", "required": false, "type": "string", "description": "Overrides common.VM_ROOT_PASS for this node only (virt_customize only)"}, {"name": "ssh_pwauth", "required": false, "type": "string", "enum": ["true", "false"], "description": "Overrides common.ssh_pwauth for this node only"}, {"name": "BRIDGE", "required": false, "type": "string", "description": "Overrides common.BRIDGE for this node only"}, {"name": "open_ports", "required": false, "type": "string", "description": "Overrides common.open_ports for this node only"}, {"name": "aws_open_ports", "required": false, "type": "string", "description": "Overrides common.aws_open_ports for this node only"}, {"name": "ISO_URL", "required": false, "type": "url", "description": "Download source for this node's own ISO_IMAGE (see common.ISO_URL)"}, {"name": "ISO_SHA256", "required": false, "type": "string", "description": "sha256 of this node's ISO_URL download"}, {"name": "ISO_SHA256_URL", "required": false, "type": "url", "description": "Published checksum file for this node's ISO_URL download"}, {"name": "config_method", "required": false, "type": "string", "enum": [{"value": "", "label": "(default) Ignition+Combustion"}, "cloud-init", "virt_customize", "install_iso"], "description": "Overrides common.config_method for this node only"}, {"name": "install_type", "required": false, "type": "string", "enum": [{"value": "", "label": "(default) auto-detect from ISO_IMAGE name"}, "autoyast", "kickstart", "preseed", "autoinstall"], "description": "Overrides common.install_type for this node only (config_method=install_iso only)"}, {"name": "network_renderer", "required": false, "type": "string", "enum": ["NetworkManager", "networkd", "sysconfig"], "description": "Overrides common.network_renderer for this node only \u2014 set per-node when a lab mixes guest OSes (e.g. SLE Micro nodes on NetworkManager, an Ubuntu/Debian node on networkd, an Alibaba Cloud Linux node on sysconfig)"}, {"name": "ISO_IMAGE", "required": false, "type": "string", "description": "Overrides common.ISO_IMAGE for this node only"}, {"name": "kvm_host", "required": false, "type": "string", "description": "Pin this VM to a specific KVM host from KVM_HOSTS; omit to auto-select by resource availability"}, {"name": "existing", "required": false, "type": "boolean", "description": "Pre-provisioned host (baremetal or already-running VM) \u2014 the tool will not create or destroy it, only SSH to it; omit for today's default (a VM this tool creates)"}, {"name": "backend", "required": false, "type": "string", "enum": ["libvirt", "harvester", "hetzner", "aws", "gcp", "alibaba", "scaleway", "upcloud", "ovhcloud", "exoscale"], "description": "Compute backend for this node; omit to use common.backend or the configured default"}, {"name": "cloud_account", "required": false, "type": "string", "description": "Overrides common.cloud_account for this node only \u2014 name of a cloud account file under /etc/lab_creation/credentials/. Its cloudtype sets this node's backend; its keys layer over lab_creation.cfg for this node only."}, {"name": "cloud_instance_type", "required": false, "type": "string", "description": "Overrides common.cloud_instance_type for this node only \u2014 cloud backends only, used verbatim instead of auto-picking from vm_cpu/vm_mem"}, {"name": "pxe_kernel", "required": false, "type": "string", "description": "PXE boot kernel path for this node (only used when the \"pxe\" service is enabled via common.services); omit to skip generating a PXE boot entry for this node"}, {"name": "pxe_initrd", "required": false, "type": "string", "description": "PXE boot initrd path for this node (pxe service only)"}, {"name": "pxe_append", "required": false, "type": "string", "description": "PXE boot kernel command-line arguments for this node (pxe service only)"}, {"name": "forwarded_ports", "required": false, "type": "array", "description": "Ports to DNAT-forward from the KVM host's real IP to this node's own myip (only used when the \"portforward\" service is enabled via common.services \u2014 meant for nodes on a NAT'd network, see lab.cfg's _network_mode). Each entry is \"<external>:<internal>/<protocol>\", e.g. \"8080:80/TCP\"."}]}, "kclusters": {"description": "Map of cluster name to Kubernetes cluster configuration", "repeatable": true, "key_label": "cluster name", "fields": [{"name": "clu_type", "required": true, "type": "string", "enum": ["rke2", "k3s"], "description": "Cluster type"}, {"name": "clu_rel", "required": true, "type": "string", "description": "Release channel: stable, latest, or a version string"}, {"name": "mydomain", "required": true, "type": "string", "description": "DNS domain for this cluster (e.g. mydemo.lab)"}, {"name": "addons", "required": false, "type": "array", "description": "List of cluster-level addon names (install_<addon> scripts)"}, {"name": "mgm_node", "required": false, "type": "string", "description": "Hostname of the node that runs addon installers (default: first server node)"}]}, "pxe": {"description": "Optional TFTP/PXE-boot/DHCP service config, used only when \"pxe\" is listed in common.services. Runs as one small podman container on the automation VM.", "fields": [{"name": "pxe_bridge", "required": false, "type": "string", "default": "br0", "description": "Bridge interface the PXE service binds to"}, {"name": "pxe_dhcp_mode", "required": false, "type": "string", "default": "off", "enum": [{"value": "off", "label": "(default) off \u2014 no DHCP; an external DHCP server must already supply PXE boot options itself"}, {"value": "proxy", "label": "proxy \u2014 PXE proxyDHCP; leases still come from an external DHCP server, this only answers the PXE-specific options"}, {"value": "full", "label": "full \u2014 this service is the DHCP server"}], "description": "DHCP role"}, {"name": "pxe_dhcp_range_start", "required": false, "type": "string", "description": "DHCP range start \u2014 required when pxe_dhcp_mode is \"full\""}, {"name": "pxe_dhcp_range_end", "required": false, "type": "string", "description": "DHCP range end \u2014 required when pxe_dhcp_mode is \"full\""}, {"name": "pxe_dhcp_lease", "required": false, "type": "string", "default": "12h", "description": "DHCP lease time \u2014 \"full\" mode only"}, {"name": "pxe_boot_filename", "required": false, "type": "string", "default": "lpxelinux.0", "description": "PXE boot filename handed out to clients (override for UEFI/iPXE chainloading)"}]}}}
