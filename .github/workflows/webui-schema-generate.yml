name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'scripts/install_*.py'
      - 'scripts/build-cube-static.py'
      - 'scripts/extract-webui-schemas.py'
      - 'webui/htdocs/**'
      - 'docs/**'
      - '.github/workflows/webui-schema-generate.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Verify Python and test extraction
        run: |
          python3.11 --version
          ls -1 scripts/install_*.py | wc -l
          python3.11 scripts/install_agones.py --schema 2>&1 | head -5

      - name: Extract addon schemas
        run: |
          cd "${{ github.workspace }}"
          python3.11 scripts/extract-webui-schemas.py > webui/htdocs/schema.json 2>&1
          echo "✓ Extracted $(jq '.addons | length' webui/htdocs/schema.json) addon schemas"
          echo "Schema file size: $(wc -c < webui/htdocs/schema.json) bytes"

      - name: Build static WebUI
        run: |
          cd "${{ github.workspace }}"
          python3.11 scripts/build-cube-static.py
          ls -lh webui/htdocs/lab-builder-static.html

      - name: Prepare GitHub Pages deployment
        run: |
          mkdir -p /tmp/gh-pages/lab-builder
          # Copy documentation as root
          cp -r docs/* /tmp/gh-pages/
          # Copy static webui to /lab-builder/ with all dependencies
          cp webui/htdocs/lab-builder-static.html /tmp/gh-pages/lab-builder/index.html
          cp webui/htdocs/schema.json /tmp/gh-pages/lab-builder/
          cp webui/htdocs/style.css /tmp/gh-pages/lab-builder/
          cp webui/htdocs/theme.js /tmp/gh-pages/lab-builder/
          cp webui/htdocs/app.js /tmp/gh-pages/lab-builder/
          cp -r webui/htdocs/vendor /tmp/gh-pages/lab-builder/
          cp webui/htdocs/*.svg /tmp/gh-pages/lab-builder/
          cp webui/htdocs/*.png /tmp/gh-pages/lab-builder/
          cp webui/htdocs/*.ico /tmp/gh-pages/lab-builder/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/gh-pages
          cname: false

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet webui/htdocs/schema.json webui/htdocs/lab-builder-static.html; then
            echo "✓ No changes to commit"
          else
            git add webui/htdocs/schema.json webui/htdocs/lab-builder-static.html
            git commit -m "chore: regenerate static webui" --no-verify || true
            git push || true
          fi
