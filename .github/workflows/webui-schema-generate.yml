name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'scripts/install_*.py'
      - 'scripts/lab_schema'
      - 'scripts/build-cube-static.py'
      - 'libs/**'
      - 'webui/htdocs/**'
      - 'webui/lib/**'
      - 'docs/**'
      - '.github/workflows/webui-schema-generate.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build static WebUI
        run: python3.11 scripts/build-cube-static.py

      - name: Prepare GitHub Pages deployment
        run: |
          mkdir -p /tmp/gh-pages/lab-builder
          cp -r docs/* /tmp/gh-pages/
          cp -r webui/htdocs/. /tmp/gh-pages/lab-builder/
          mv /tmp/gh-pages/lab-builder/lab-builder-static.html /tmp/gh-pages/lab-builder/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/gh-pages
          cname: false
