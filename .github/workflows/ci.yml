name: CI

# Runs on every push and pull request against main/dev. Three independent
# jobs, matching the project's own local conventions (see tests/run_tests.sh
# and README.md#testing) rather than reimplementing separate logic here:
#
#   python311   - every .py file (and scripts/lab_schema, and every
#                 install_<addon> script) must at minimum PARSE and IMPORT
#                 cleanly on Python 3.11, the project's pinned minimum.
#   addon-schemas - every install_<addon> executable (any language, with
#                 or without a file extension) must be executable and print
#                 its own configuration schema without crashing (--schema,
#                 both JSON and YAML) -- this is the same contract the web UI
#                 relies on to render its forms.
#   test-suite  - the authoritative gate: the project's own containerized
#                 test suite (tests/run_tests.sh), unchanged. Every check
#                 that already runs locally before a commit runs here too.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  changes:
    name: Detect which files changed
    runs-on: ubuntu-latest
    outputs:
      py: ${{ steps.filter.outputs.py }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Classify changed files (every job runs on push; PRs run only what they touch)
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "py=true" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; echo "$files"
          py=false; code=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              *.md|docs/*|media/*|readme-brand/*) ;;
              *) code=true ;;
            esac
            case "$f" in
              *.py|scripts/lab_schema|scripts/install_*|libs/*) py=true; code=true ;;
            esac
          done <<< "$files"
          echo "py=$py" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  python311:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    name: Python 3.11 syntax + import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Byte-compile every .py file (+ lab_schema) on 3.11
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            python3.11 -m py_compile "$f" || fail=1
          done < <(find . -name '*.py' -not -path './.git/*' -not -path '*/__pycache__/*' -print0)
          python3.11 -m py_compile scripts/lab_schema || fail=1
          exit "$fail"
      - name: Import every shared library module on 3.11
        run: |
          python3.11 - <<'PY'
          import sys
          sys.path.insert(0, "libs")
          import addon_common, backends, k8s, lab_creation, primary, services, spacecmd_common
          print("all libs/ modules imported cleanly on", sys.version)
          PY

  addon-schemas:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    name: Every add-on prints its schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install runtime deps needed for --schema yaml
        run: pip install -q pyyaml
      - name: setup_lab.py --input-definition (base topology schema)
        # lab_schema is resolved via PATH (shutil.which), not a hardcoded
        # install path — matches how it's actually deployed alongside every
        # other script under /usr/local/bin on a real automation VM.
        run: |
          export PATH="$PWD/scripts:$PATH"
          python3.11 scripts/setup_lab.py --input-definition
          python3.11 scripts/setup_lab.py --input-definition yaml
      - name: install_<addon> --schema, for every addon
        # Each add-on runs as its own executable (its shebang picks the
        # language), exactly as setup_lab.py and the web UI run it.
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            echo "== $f =="
            [[ -x "$f" ]] || { echo "FAIL (not executable): $f"; fail=1; continue; }
            "./$f" --schema json | python3.11 -c 'import json,sys; assert json.load(sys.stdin)["capabilities"]' \
              || { echo "FAIL (json): $f"; fail=1; }
            "./$f" --schema yaml >/dev/null || { echo "FAIL (yaml): $f"; fail=1; }
          done < <(git ls-files 'scripts/install_*')
          exit "$fail"

  test-suite:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Containerized test suite (tests/run_tests.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman
      - name: Run the project's own test suite
        run: tests/run_tests.sh

  shellcheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: shellcheck (bash sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck .githooks, setup_demo_server, active scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          # legacy_bash/ is frozen, superseded-by-Python code (see README) —
          # not held to current lint standards. tests/ has its own
          # containerized suite as the real gate.
          ignore_paths: ".git legacy_bash tests"
          # install_ds389 (never ported to Python — see README's "Under the
          # hood") and the 4 bash helpers it needs at runtime
          # (lab_creation.bash/k8s_functions.bash/primary_functions.bash/
          # extensions.sh, deployed alongside the Python libs by
          # install_automation_node_scripts.sh's own "one directory, one
          # loop" comment — see there) are permanently unported, same
          # "frozen, not held to current lint standards" stance as
          # legacy_bash/ above. Found in code review 2026-09-05: these were
          # never actually excluded, so this job has likely been failing on
          # their own pre-existing warnings since the workflow was added,
          # unrelated to whatever change a given run's diff actually made.
          ignore_names: "install_ds389 lab_creation.bash k8s_functions.bash primary_functions.bash extensions.sh"
          additional_files: ".githooks/*"
          severity: warning
        env:
          # SC1090/SC1091 (can't follow a dynamic/non-constant source path)
          # and SC2154 (var referenced but not assigned) are both expected
          # and structural here, not bugs: these scripts source config and
          # reference variables that only exist via lab_creation.cfg,
          # process_templates' eval-based injection, or an operator's own
          # env — never resolvable from a static CI checkout.
          SHELLCHECK_OPTS: -e SC1090 -e SC1091 -e SC2154
