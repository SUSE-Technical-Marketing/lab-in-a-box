/text><text x="588" y="142" class="cs" text-anchor="start">reboot_and_</text><text x="588" y="156" class="cs" text-anchor="start">wait_kept_nodes</text><text x="588" y="180" class="s" text-anchor="start">Settle the kept nodes</text><path d="M738 139 H754" fill="none" stroke="#a9aeb7" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"></path><rect x="756" y="64" width="164" height="150" rx="12" fill="#23272d" stroke="#d9c7a3" stroke-width="1.6" stroke-dasharray="6 4"></rect><text x="772" y="98" class="n" style="fill:#8fa0bd">5</text><text x="772" y="122" class="h" text-anchor="start">Kubernetes</text><text x="772" y="142" class="cs" text-anchor="start">install_k8s_</text><text x="772" y="156" class="cs" text-anchor="start">and_addons</text><text x="772" y="180" class="s" text-anchor="start">RKE2 or K3s, then</text><text x="772" y="196" class="s" text-anchor="start">cluster add-ons</text><path d="M922 139 H938" fill="none" stroke="#a9aeb7" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"></path><rect x="940" y="64" width="164" height="150" rx="12" fill="#2c3138" stroke="#3d434c" stroke-width="1.2"></rect><text x="956" y="98" class="n" style="fill:#2fd1c2">6</text><text x="956" y="122" class="h" text-anchor="start">VM add-ons</text><text x="956" y="142" class="cs" text-anchor="start">vm_addons</text><text x="956" y="166" class="s" text-anchor="start">Add-ons on single VMs</text><path d="M122 214 V242 H450 V216" fill="none" stroke="#f08a74" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"></path><path d="M490 214 V242 H1002 V216" fill="none" stroke="#f08a74" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"></path><text x="286" y="262" class="l" text-anchor="middle">VM-only lab (no kclusters): skip DNS</text><text x="746" y="262" class="l" text-anchor="middle">VM-only lab: skip reboot &amp; Kubernetes</text><rect x="20" y="296" width="22" height="14" rx="4" fill="#23272d" stroke="#d9c7a3" stroke-width="1.6" stroke-dasharray="4 3"></rect><text x="50" y="307" class="s" text-anchor="start">Kubernetes-only phase: skipped when the lab has no kclusters</text>
