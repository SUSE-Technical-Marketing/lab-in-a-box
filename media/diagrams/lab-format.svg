<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" width="900" height="455" role="img" aria-label="Lab definition format: lab.json contains nodes, common, kclusters and add-on sections that reference each other" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Lab definition format: lab.json contains nodes, common, kclusters and add-on sections that reference each other</title>

<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#5a606b"></path></marker></defs>
<rect width="900" height="455" rx="18" fill="#f3f4f5"></rect>
<g><rect x="20" y="170" width="150" height="80" rx="10" fill="#e5f3f1" stroke="#12a99d" stroke-width="1.2"></rect><rect x="34" y="196.5" width="11" height="11" rx="2.5" fill="#12a99d"></rect><text x="53" y="207.5" class="h">lab.json</text><text x="34" y="228.5" class="s" text-anchor="start">or lab.yaml</text></g><g><rect x="260" y="30" width="240" height="76" rx="10" fill="#ffffff" stroke="#d5d9de" stroke-width="1.2"></rect><rect x="274" y="46" width="11" height="11" rx="2.5" fill="#1f2f4a"></rect><text x="293" y="57" class="h">nodes</text><text x="274" y="78" class="s" text-anchor="start">per VM: myip, mymac, kcluster,</text><text x="274" y="95" class="s" text-anchor="start">addons…</text></g><path d="M170 210 H215 V68 H260" fill="none" stroke="#5a606b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"></path><g><rect x="260" y="130" width="240" height="76" rx="10" fill="#ffffff" stroke="#d5d9de" stroke-width="1.2"></rect><rect x="274" y="146" width="11" height="11" rx="2.5" fill="#d9c7a3"></rect><text x="293" y="157" class="h">common</text><text x="274" y="178" class="s" text-anchor="start">shared defaults: ISO_IMAGE,</text><text x="274" y="195" class="s" text-anchor="start">VM_MEM, VM_DSK…</text></g><path d="M170 210 H215 V168 H260" fill="none" stroke="#5a606b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"></path><g><rect x="260" y="230" width="240" height="76" rx="10" fill="#ffffff" stroke="#d5d9de" stroke-width="1.2"></rect><rect x="274" y="246" width="11" height="11" rx="2.5" fill="#e2725b"></rect><text x="293" y="257" class="h">kclusters</text><text x="274" y="278" class="s" text-anchor="start">clu_type, clu_rel, mydomain,</text><text x="274" y="295" class="s" text-anchor="start">addons</text></g><path d="M170 210 H215 V268 H260" fill="none" stroke="#5a606b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"></path><g><rect x="260" y="330" width="240" height="76" rx="10" fill="#ffffff" stroke="#d5d9de" stroke-width="1.2"></rect><rect x="274" y="346" width="11" height="11" rx="2.5" fill="#12a99d"></rect><text x="293" y="357" class="h">add-on sections</text><text x="274" y="378" class="s" text-anchor="start">one per add-on, e.g. rancher,</text><text x="274" y="395" class="s" text-anchor="start">longhorn</text></g><path d="M170 210 H215 V368 H260" fill="none" stroke="#5a606b" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"></path><path d="M500 56 H560 V268 H500" fill="none" stroke="#0f8f86" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"></path><text x="570" y="166" class="l" text-anchor="start">kcluster</text><path d="M380 306 V330" fill="none" stroke="#0f8f86" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"></path><text x="392" y="322" class="l" text-anchor="start">addons</text><path d="M500 40 H640 V368 H500" fill="none" stroke="#0f8f86" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"></path><text x="650" y="210" class="l" text-anchor="start">addons</text><text x="20" y="440" class="s" text-anchor="start">Solid lines: file structure. Dashed lines: references by name.</text>
</svg>