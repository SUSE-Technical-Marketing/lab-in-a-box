<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.2 L9 5 L1 8.8 Z" fill="#a9aeb7"/></marker></defs>
<rect width="1000" height="230" rx="18" fill="#1b1e23"/>
<text x="20" y="34" class="m" text-anchor="start">Quick start</text><rect x="20" y="56" width="148" height="140" rx="12" fill="#2c3138" stroke="#3d434c" stroke-width="1.2"/><rect x="34" y="70" width="30" height="30" rx="6" fill="#2fd1c2"/><text x="49" y="92" text-anchor="middle" style='font:800 16px "Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;fill:#1b1e23'>1</text><text x="34" y="128" class="h" text-anchor="start">Install the</text><text x="34" y="146" class="h" text-anchor="start">hypervisor OS</text><path d="M169 85 H181" fill="none" stroke="#a9aeb7" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="182" y="56" width="148" height="140" rx="12" fill="#2c3138" stroke="#3d434c" stroke-width="1.2"/><rect x="196" y="70" width="30" height="30" rx="6" fill="#8fa0bd"/><text x="211" y="92" text-anchor="middle" style='font:800 16px "Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;fill:#1b1e23'>2</text><text x="196" y="128" class="h" text-anchor="start">Run the setup</text><text x="196" y="146" class="h" text-anchor="start">command</text><path d="M331 85 H343" fill="none" stroke="#a9aeb7" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="344" y="56" width="148" height="140" rx="12" fill="#2c3138" stroke="#3d434c" stroke-width="1.2"/><rect x="358" y="70" width="30" height="30" rx="6" fill="#f08a74"/><text x="373" y="92" text-anchor="middle" style='font:800 16px "Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;fill:#1b1e23'>3</text><text x="358" y="128" class="h" text-anchor="start">Re-run or change</text><text x="358" y="146" class="h" text-anchor="start">the setup</text><path d="M493 85 H505" fill="none" stroke="#a9aeb7" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="506" y="56" width="148" height="140" rx="12" fill="#2c3138" stroke="#3d434c" stroke-width="1.2"/><rect x="520" y="70" width="30" height="30" rx="6" fill="#d9c7a3"/><text x="535" y="92" text-anchor="middle" style='font:800 16px "Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;fill:#1b1e23'>4</text><text x="520" y="128" class="h" text-anchor="start">Configure the</text><text x="520" y="146" class="h" text-anchor="start">automation VM</text><path d="M655 85 H667" fill="none" stroke="#a9aeb7" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="668" y="56" width="148" height="140" rx="12" fill="#2c3138" stroke="#3d434c" stroke-width="1.2"/><rect x="682" y="70" width="30" height="30" rx="6" fill="#2fd1c2"/><text x="697" y="92" text-anchor="middle" style='font:800 16px "Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;fill:#1b1e23'>5</text><text x="682" y="128" class="h" text-anchor="start">Point client DNS</text><text x="682" y="146" class="h" text-anchor="start">at the</text><text x="682" y="164" class="h" text-anchor="start">automation VM</text><path d="M817 85 H829" fill="none" stroke="#a9aeb7" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="830" y="56" width="148" height="140" rx="12" fill="#1f3a3a" stroke="#2fd1c2" stroke-width="1.2"/><rect x="844" y="70" width="30" height="30" rx="6" fill="#8fa0bd"/><text x="859" y="92" text-anchor="middle" style='font:800 16px "Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;fill:#1b1e23'>6</text><text x="844" y="128" class="h" text-anchor="start">Build your first</text><text x="844" y="146" class="h" text-anchor="start">lab</text>
