.l{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:500;fill:#a9aeb7;paint-order:stroke;stroke:#1b1e23;stroke-width:5px;stroke-linejoin:round}
.n{font-family:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:26px;font-weight:800;fill:#f3f4f5;letter-spacing:-.03em}
