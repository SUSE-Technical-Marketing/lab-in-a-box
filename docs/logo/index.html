<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lab-in-a-box — 3D logo</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:#eceef1;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#23272d}
  a{color:#0f8f86} a:hover{color:#0b6e67}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
  .mark{position:fixed;left:28px;top:24px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
  .mark img{width:260px;height:auto}
  .mark small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5a606b}
  @media (prefers-color-scheme: dark){html,body{background:#0d1117;color:#f3f4f5}.mark small{color:#a9aeb7}}
</style>
</head>
<body>
<three-d-stage name="lab-in-a-box-logo" background="#eceef1" autorotate></three-d-stage>
<div class="mark">
  <picture><source media="(prefers-color-scheme: dark)" srcset="./logo-text-dark.png"><img src="./logo-text.png" alt="lab-in-a-box"></picture>
  <small>Drag to rotate · scroll to zoom</small>
</div>
<script src="three-d-stage.js"></script>
<script type="module">
import { createLogoKit } from './lab-logo-model.js';
const stage = document.querySelector('three-d-stage');
if (matchMedia('(prefers-color-scheme: dark)').matches) stage.setAttribute('background', '#0d1117');
const { THREE } = await stage.ready;
const { buildLogo } = createLogoKit(THREE);
stage.setObject(buildLogo({ variant: 'deploying', frame: 'round', emblem: 'labyrinth', boxes: 'bright', letters: 'auto', dot: 'graphite', frameColor: 'aluminum', cube: 'graphite', ink: 'gold' }));
</script>
</body>
</html>
