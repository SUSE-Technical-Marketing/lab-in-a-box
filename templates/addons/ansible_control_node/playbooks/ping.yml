---
# Example playbook 1/3 — connectivity smoke test.
# Confirms Ansible can actually reach every host in the inventory before
# trying anything more ambitious. Run first against any new inventory:
#   ansible-playbook -i <inventory> ping.yml
- name: Confirm every inventory host is reachable
  hosts: all
  gather_facts: false
  tasks:
    - name: Ping
      ansible.builtin.ping:

    - name: Report the OS each host identifies as
      ansible.builtin.setup:
        filter: ansible_distribution*
      register: os_facts

    - name: Print a one-line summary per host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ os_facts.ansible_facts.ansible_distribution }}
          {{ os_facts.ansible_facts.ansible_distribution_version }}
