# HTTPS (port 443) for everything the automation node serves under its document root: provisioning files
# (/lab_creation/), helm, lab-builder. Port 80 keeps serving the same content over plain HTTP.
#
# Installed by install_automation_node_scripts.sh to:
#   /etc/apache2/vhosts.d/lab_creation-ssl.conf   (SLES/openSUSE)
#   /etc/httpd/conf.d/lab_creation-ssl.conf       (RHEL family; the Listen line is dropped when mod_ssl's ssl.conf exists)
#
# Requires mod_ssl. The certificate is self-signed, generated once at /etc/lab_creation/tls/{cert,key}.pem.
# The vhost inherits the main server's DocumentRoot and Alias directives.

# openSUSE's listen.conf already opens 443 when the SSL server flag is set.
<IfDefine !SSL>
Listen 443
</IfDefine>

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile    /etc/lab_creation/tls/cert.pem
    SSLCertificateKeyFile /etc/lab_creation/tls/key.pem
</VirtualHost>
